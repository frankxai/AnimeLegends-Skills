name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make validator executable
        run: chmod +x tests/validate-skills.sh

      - name: Run validator
        run: ./tests/validate-skills.sh skills/animelegends

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            skills/**/*.md
            templates/*.md
            !CATALOG.md
            !CHANGELOG.md
            !AGENTS.md
            !README.md
            !INSTALL.md
            !LICENSE.md
            !ECOSYSTEM.md
            !CLAUDE.md
            !CONTRIBUTING.md

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          use-verbose-mode: yes
          config-file: .github/markdown-link-check-config.json
        continue-on-error: true
